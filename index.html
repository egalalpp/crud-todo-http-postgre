<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arch Todo Pro</title>
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5;
            --bg: #0f172a; --card-bg: #1e293b;
            --text: #f8fafc; --text-muted: #94a3b8;
            --danger: #ef4444; --success: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 500px; }

        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 30px; letter-spacing: -1px; }

        /* Форма создания */
        .input-card {
            background: var(--card-bg);
            padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05);
        }

        input, textarea {
            width: 100%; background: #0f172a; border: 1px solid #334155;
            color: white; padding: 12px; border-radius: 8px;
            margin-bottom: 12px; box-sizing: border-box; font-size: 14px;
        }

        button.main-btn {
            width: 100%; background: var(--primary); color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }

        button.main-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* Список задач */
        .task-list { list-style: none; padding: 0; }
        .task-item {
            background: var(--card-bg); margin-bottom: 12px;
            padding: 16px; border-radius: 12px;
            display: flex; align-items: center; gap: 15px;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }

        .task-item:hover { border-color: var(--primary); }

        .checkbox {
            width: 22px; height: 22px; border-radius: 6px;
            cursor: pointer; accent-color: var(--primary);
        }

        .task-content { flex: 1; cursor: pointer; }
        .task-title { display: block; font-weight: 600; font-size: 16px; }
        .task-title.completed { text-decoration: line-through; color: var(--text-muted); }
        .task-desc { display: block; font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .btn-del {
            background: none; border: none; color: #475569;
            font-size: 20px; cursor: pointer; transition: 0.2s;
        }
        .btn-del:hover { color: var(--danger); }

        /* Модалка редактирования */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; z-index: 100;
        }

        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-header { margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; }
        .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
        
        .btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-cancel { background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Arch Tasks</h1>

    <div class="input-card">
        <input type="text" id="newTitle" placeholder="Заголовок задачи...">
        <textarea id="newDesc" rows="2" placeholder="Описание..."></textarea>
        <button class="main-btn" onclick="createTask()">Добавить задачу</button>
    </div>

    <ul id="taskList" class="task-list"></ul>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">Редактировать задачу</div>
        <input type="text" id="editTitle">
        <textarea id="editDesc" rows="4"></textarea>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button class="btn-save" onclick="saveEdit()">Сохранить изменения</button>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/tasks';
    let currentEditingId = null;
    let currentTaskStatus = false;

    async function loadTasks() {
        const res = await fetch(API);
        const tasks = await res.json() || [];
        const list = document.getElementById('taskList');
        list.innerHTML = '';

        tasks.forEach(t => {
            const li = document.createElement('li');
            li.className = 'task-item';
            // Сохраняем данные в атрибуты для редактирования
            li.dataset.id = t.id;
            li.dataset.title = t.title;
            li.dataset.desc = t.description;
            li.dataset.status = t.is_completed;

            li.innerHTML = `
                <input type="checkbox" class="checkbox" ${t.is_completed ? 'checked' : ''} 
                       onclick="toggleComplete(event, ${t.id}, '${t.title}', '${t.description}', ${t.is_completed})">
                <div class="task-content" onclick="openEditModal(${t.id}, '${t.title}', '${t.description}', ${t.is_completed})">
                    <span class="task-title ${t.is_completed ? 'completed' : ''}">${t.title}</span>
                    <span class="task-desc">${t.description || 'Нет описания'}</span>
                </div>
                <button class="btn-del" onclick="deleteTask(${t.id})">&times;</button>
            `;
            list.appendChild(li);
        });
    }

    async function createTask() {
        const title = document.getElementById('newTitle').value;
        const description = document.getElementById('newDesc').value;
        if (!title) return alert("Введите название!");

        await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description })
        });

        document.getElementById('newTitle').value = '';
        document.getElementById('newDesc').value = '';
        loadTasks();
    }

    // Открытие модалки для редактирования
    function openEditModal(id, title, desc, status) {
        currentEditingId = id;
        currentTaskStatus = status;
        document.getElementById('editTitle').value = title;
        document.getElementById('editDesc').value = desc;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // Сохранение отредактированных данных (PUT)
    async function saveEdit() {
        const title = document.getElementById('editTitle').value;
        const description = document.getElementById('editDesc').value;

        await fetch(`${API}/${currentEditingId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: currentEditingId,
                title: title,
                description: description,
                is_completed: currentTaskStatus
            })
        });

        closeModal();
        loadTasks();
    }

    // Быстрая смена статуса (Галочка)
    async function toggleComplete(e, id, title, desc, status) {
        e.stopPropagation();
        await fetch(`${API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: id,
                title: title,
                description: desc,
                is_completed: !status
            })
        });
        loadTasks();
    }

    async function deleteTask(id) {
        if (!confirm("Удалить задачу?")) return;
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        loadTasks();
    }

    window.onclick = (e) => { if(e.target.id === 'editModal') closeModal(); }
    
    loadTasks();
</script>
</body>
</html>
